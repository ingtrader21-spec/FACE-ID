name: ci

on:
  push:
    branches: ["development", "testing", "staging", "production", "mission/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: faceid
          POSTGRES_PASSWORD: faceid_test_password
          POSTGRES_DB: faceid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faceid -d faceid_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://faceid:faceid_test_password@127.0.0.1:5432/faceid_test
      FACEID_EVENT_DIR: /tmp/faceid-test-events
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest
      - name: Python compile
        run: python -m py_compile app/main.py
      - name: Dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("app/static/dashboard.html").read_text()
          Path("/tmp/faceid-dashboard.js").write_text(html.split("<script>",1)[1].split("</script>",1)[0])
          PY
          node --check /tmp/faceid-dashboard.js
      - name: Tests
        run: python -m pytest -q
      - name: Docker build
        run: docker build -t codestra-face-id:ci .
